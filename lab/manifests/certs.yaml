# TLS for podinfo, issued in-cluster by cert-manager (installed by up.sh):
# self-signed root -> lab-ca (CA issuer) -> podinfo cert. cert-manager writes
# tls.crt, tls.key and ca.crt into podinfo-tls; podinfo serves the first two
# and the gateway trusts ca.crt (TLS.CACertFile: ca.pem).
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: selfsigned
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: lab-ca
spec:
  isCA: true
  commonName: lab-ca
  secretName: lab-ca
  privateKey: {algorithm: ECDSA, size: 256}
  issuerRef: {name: selfsigned, kind: Issuer}
---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: lab-ca
spec:
  ca:
    secretName: lab-ca
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: podinfo
spec:
  secretName: podinfo-tls
  dnsNames: [podinfo, podinfo.nocleye-obs.svc, podinfo.nocleye-obs.svc.cluster.local]
  issuerRef: {name: lab-ca, kind: Issuer}

services:
  gateway:
    image: nocleye/api-gateway:v0.1.0-beta
    ports:
      - "8080:8080"
    environment:
      GATEWAY_CONFIG_PATH: gateway.yaml
    volumes:
      - ./gateway.yaml:/etc/nocleye-beta/gateway/gateway.yaml:ro
    depends_on:
      - app

  # No published port: the only way to reach it is through the gateway.
  app:
    build: ./app
